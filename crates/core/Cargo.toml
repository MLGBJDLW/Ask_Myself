[package]
name = "nexa-core"
version = "0.11.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "modern-full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
sha2 = "0.10"
hmac = "0.12"
filetime = "0.2"
globset = "0.4"
ignore = "0.4"
regex = "1"
scraper = "0.27"
readabilityrs = "0.1.3"
headless_chrome = "1.0.22"
quick-xml = "0.41"
strsim = "0.11"
thiserror = "2"
tracing = "0.1"
ort = { version = "2.0.0-rc.11", features = ["download-binaries", "ndarray"], optional = true }
tiktoken-rs = "0.11.0"
tokenizers = { version = "0.23", default-features = false, features = ["progressbar", "onig"], optional = true }
ndarray = { version = "0.17", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart", "stream", "cookies", "gzip", "brotli", "deflate", "zstd", "charset", "http2"], default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
notify = { version = "8", features = ["macos_kqueue"] }
dirs = "6"
lopdf = "0.44"
calamine = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
base64 = "0.22"
bytes = "1"
aes-gcm = "0.10"
imageproc = { version = "0.27", default-features = false }
encoding_rs = "0.8"
unicode-normalization = "0.1"
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
hound = { version = "3.5", optional = true }
tempfile = { version = "3", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
xz2 = { version = "0.1", optional = true }
tar = { version = "0.4", optional = true }
walkdir = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6.1", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "2.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["ocr", "local-embeddings"]
onnx-runtime = ["dep:ort", "dep:ndarray"]
local-embeddings = ["onnx-runtime", "dep:tokenizers"]
ocr = ["onnx-runtime"]
video = ["candle-core", "candle-nn", "candle-transformers", "hound", "tempfile", "xz2", "tar", "dep:tokenizers"]

[dev-dependencies]
tempfile = "3"
