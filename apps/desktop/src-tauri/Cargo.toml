[package]
name = "nexa-desktop"
version = "0.13.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "protocol-asset", "unstable", "macos-proxy", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["sync", "rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }
nexa-core = { path = "../../../crates/core", default-features = false }
base64 = "0.22"
rusqlite = { version = "0.32" }
chrono = { version = "0.4", features = ["clock"] }
blake3 = "1"
encoding_rs = "0.8"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
gtk = "0.18.2"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSObject", "NSValue"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["block2", "objc2-app-kit", "WKSnapshotConfiguration", "WKWebView"] }

[features]
default = ["custom-protocol", "video", "ocr", "local-embeddings"]
custom-protocol = ["tauri/custom-protocol"]
local-embeddings = ["nexa-core/local-embeddings"]
ocr = ["nexa-core/ocr"]
video = ["nexa-core/video"]
