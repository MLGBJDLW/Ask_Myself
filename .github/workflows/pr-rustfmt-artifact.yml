name: PR Source Artifact

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  source-artifact:
    name: Capture files for validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Upload relevant files
        uses: actions/upload-artifact@v4
        with:
          name: live-inline-diff-sources
          if-no-files-found: error
          path: |
            apps/desktop/src/components/chat/FileDiffPreview.tsx
            apps/desktop/src/components/chat/ToolCallCard.tsx
            apps/desktop/src/lib/streaming/toolProjection.ts
            apps/desktop/tests/live-file-streaming.test.ts
            crates/core/src/agent/tool_runtime.rs
            crates/core/src/tools/capability.rs
            crates/core/src/tools/create_file_tool.rs
