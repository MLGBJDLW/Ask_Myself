name: Apply Live Inline File Diff

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-live-inline-diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/nexa-patches/live-inline-diff.part-* | base64 --decode > /tmp/live-inline-diff.patch
          git apply --check /tmp/live-inline-diff.patch
          git apply /tmp/live-inline-diff.patch
          rm -f .github/nexa-patches/live-inline-diff.part-*
          rm -f .github/nexa-patches/chunk-00.b64
          rm -f .github/workflows/pr-rustfmt-artifact.yml

      - name: Commit applied implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): render file changes as live inline diffs"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
