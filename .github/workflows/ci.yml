name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject tracked local research docs
        shell: bash
        run: |
          tracked="$(git ls-files -- \
            'docs/research/**' \
            'docs/local/**' \
            'docs/*-primary-source-research.md' \
            'docs/**/*-primary-source-research.md' \
            'docs/*-implementation-research.md' \
            'docs/**/*-implementation-research.md')"
          if [[ -n "$tracked" ]]; then
            echo "Local-only research documents must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libdbus-1-dev libreoffice-calc poppler-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Cache ONNX Runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ort.pyke.io
          key: ${{ runner.os }}-ort-${{ hashFiles('crates/core/Cargo.toml') }}

      - name: Install cargo-audit
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Rust dependency audit
        run: cargo audit

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy -p nexa-core -- -D warnings

      - name: Core feature boundary checks
        run: |
          cargo check -p nexa-core --no-default-features
          cargo check -p nexa-core --no-default-features --features local-embeddings
          cargo check -p nexa-core --no-default-features --features ocr
          cargo check -p nexa-core --no-default-features --features video

      - name: Office artifact runtime smoke
        run: |
          python3 -m venv /tmp/nexa-office-venv
          /tmp/nexa-office-venv/bin/python -m pip install --disable-pip-version-check -r crates/core/assets/skills/doc-script-editor/scripts/requirements.txt
          /tmp/nexa-office-venv/bin/python crates/core/assets/skills/doc-script-editor/scripts/test_office_artifact_runtime.py -v
          /tmp/nexa-office-venv/bin/python crates/core/assets/skills/xlsx-workbook-design/scripts/test_xlsx_model_renderer.py -v
          /tmp/nexa-office-venv/bin/python crates/core/assets/skills/pptx-presentation-design/scripts/test_pptx_renderer.py -v
          /tmp/nexa-office-venv/bin/python crates/core/assets/skills/pptx-presentation-design/scripts/test_html_deck_renderer.py -v
          /tmp/nexa-office-venv/bin/python crates/core/assets/skills/pptx-presentation-design/scripts/test_pptx_upgrade_pipeline.py -v

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Root dependency audit
        run: npm audit --audit-level=moderate

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend dependency audit
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Frontend streaming contracts
        working-directory: apps/desktop
        run: npm test

      - name: Model catalog static audit
        run: npm run catalog:audit

      - name: Model catalog audit fixtures
        run: npm run catalog:audit:test

      - name: TypeScript check
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: apps/desktop
        run: npx vite build

      - name: Install browser for critical chat UI regressions
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: Critical chat UI regressions
        working-directory: apps/desktop
        run: >-
          npx playwright test
          e2e/app-window-frame.spec.ts
          e2e/chat-conversation-archive.spec.ts
          e2e/chat-done-preview-persistence.spec.ts
          e2e/chat-mermaid-rendering.spec.ts
          e2e/chat-model-switch-context.spec.ts
          e2e/chat-browser-workspace.spec.ts
          e2e/chat-terminal-dock.spec.ts
          e2e/chat-turn-navigation.spec.ts
          e2e/chat-plan-progress-panel.spec.ts
          e2e/chat-recording-dock.spec.ts
          --grep "themed window frame|conversation actions offer archive and delete|archived conversations can be restored|a direct archived conversation link|model selector|shared Browser Workspace|interactive terminal dock|floating plan capsule|only the Plan capsule drags|Mermaid|turn timeline|right-side timeline|file edit badges|recording dock exposes responsive"

      - name: Desktop Rust check
        run: cargo check -p nexa-desktop

      - name: Agent eval smoke
        run: cargo test -p nexa-core developer_eval_smoke_workflow

      - name: Cargo test
        run: cargo test -p nexa-core

  windows-check:
    name: Windows Desktop Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Prepare Tauri frontend stub
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/dist | Out-Null
          Set-Content -Path apps/desktop/dist/index.html -Value '<!doctype html><html></html>'

      - name: Desktop Rust check
        run: cargo check -p nexa-desktop
