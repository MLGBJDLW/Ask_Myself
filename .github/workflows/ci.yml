name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libdbus-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Cache ONNX Runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ort.pyke.io
          key: ${{ runner.os }}-ort-${{ hashFiles('crates/core/Cargo.toml') }}

      - name: Install cargo-audit
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Rust dependency audit
        run: cargo audit

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy -p nexa-core -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Root dependency audit
        run: npm audit --audit-level=moderate

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend dependency audit
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Frontend streaming contracts
        working-directory: apps/desktop
        run: npm test

      - name: TypeScript check
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: apps/desktop
        run: npx vite build

      - name: Install browser for critical chat UI regressions
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: Critical chat UI regressions
        working-directory: apps/desktop
        run: >-
          npx playwright test
          e2e/app-window-frame.spec.ts
          e2e/chat-mermaid-rendering.spec.ts
          e2e/chat-turn-navigation.spec.ts
          e2e/chat-plan-progress-panel.spec.ts
          --grep "themed window frame|floating plan capsule|only the Plan capsule drags|Mermaid|turn timeline|right-side timeline"

      - name: Desktop Rust check
        run: cargo check -p nexa-desktop

      - name: Agent eval smoke
        run: cargo test -p nexa-core developer_eval_smoke_workflow

      - name: Cargo test
        run: cargo test -p nexa-core
