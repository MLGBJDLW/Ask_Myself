name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Verification jobs are split by dependency and failure domain so a native
  # package outage cannot prevent unrelated Rust or frontend feedback.
  repository_policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Reject tracked local research docs
        shell: bash
        run: |
          tracked="$(git ls-files -- \
            'docs/research/**' \
            'docs/local/**' \
            'docs/*-primary-source-research.md' \
            'docs/**/*-primary-source-research.md' \
            'docs/*-implementation-research.md' \
            'docs/**/*-implementation-research.md')"
          if [[ -n "$tracked" ]]; then
            echo "Local-only research documents must not be tracked:"
            echo "$tracked"
            exit 1
          fi

  rust_core:
    name: Rust Core
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Cache ONNX Runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ort.pyke.io
          key: ${{ runner.os }}-ort-${{ hashFiles('crates/core/Cargo.toml') }}

      - name: Install cargo-audit
        run: |
          if ! cargo audit --version 2>/dev/null | grep -q '0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Rust dependency audit
        run: cargo audit

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy -p nexa-core -- -D warnings

      - name: Core feature boundary checks
        run: |
          cargo check -p nexa-core --no-default-features
          cargo check -p nexa-core --no-default-features --features local-embeddings
          cargo check -p nexa-core --no-default-features --features ocr
          cargo check -p nexa-core --no-default-features --features video

      - name: Agent eval smoke
        run: cargo test -p nexa-core developer_eval_smoke_workflow

      - name: Cargo test
        run: cargo test -p nexa-core

  office_smoke:
    name: Office Artifact Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked PPTX author adapter
        run: npm ci --ignore-scripts

      - name: Verify release workflow recovery contract
        run: npm run release:workflow:test

      - name: Verify Office author supply chain and bundle closure
        run: |
          npm audit --audit-level=high
          npm run office:supply-chain:test
          npm run office:pptxgenjs:bundle
          test -f apps/desktop/src-tauri/resources/pptxgenjs-runtime/runtime-manifest.json

      - name: Verify Office.js add-in contract
        run: |
          npm run office:addin:test
          python3 integrations/office-addin/test_deployment.py -v

      - name: Build pinned Open XML SDK validator
        run: |
          dotnet restore tools/openxml-validator/Nexa.OpenXml.Validator.csproj --locked-mode
          dotnet publish tools/openxml-validator/Nexa.OpenXml.Validator.csproj -c Release --no-restore

      - name: Install Office smoke dependencies
        uses: ./.github/actions/install-ubuntu-packages
        timeout-minutes: 12
        with:
          packages: |
            libreoffice-writer
            libreoffice-calc
            libreoffice-impress
            poppler-utils

      - name: Office artifact runtime smoke
        env:
          NEXA_OPENXML_VALIDATOR: ${{ github.workspace }}/tools/openxml-validator/bin/Release/net8.0/publish/Nexa.OpenXml.Validator.dll
        run: |
          command -v soffice
          command -v pdftoppm
          soffice --headless --version
          pdftoppm -v
          python3 -m venv /tmp/nexa-office-venv
          /tmp/nexa-office-venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r crates/core/assets/skills/doc-script-editor/scripts/requirements.lock
          for suite in \
            crates/core/assets/skills/doc-script-editor/scripts \
            crates/core/assets/skills/docx-document-design/scripts \
            crates/core/assets/skills/xlsx-workbook-design/scripts \
            crates/core/assets/skills/pptx-presentation-design/scripts; do
            /tmp/nexa-office-venv/bin/python -m unittest discover -v -s "$suite" -p 'test_*.py'
          done

  frontend:
    name: Frontend Contracts & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Root dependency audit
        run: npm audit --audit-level=moderate

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend dependency audit
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Frontend streaming contracts
        working-directory: apps/desktop
        run: npm test

      - name: Model catalog static audit
        run: npm run catalog:audit

      - name: Model catalog audit fixtures
        run: npm run catalog:audit:test

      - name: TypeScript check
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: apps/desktop
        run: npx vite build

  browser_regressions:
    name: Browser Regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Configure Ubuntu APT
        uses: ./.github/actions/configure-ubuntu-apt

      - name: Install browser
        working-directory: apps/desktop
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Critical chat UI regressions
        working-directory: apps/desktop
        run: >-
          npx playwright test
          e2e/app-window-frame.spec.ts
          e2e/chat-conversation-archive.spec.ts
          e2e/chat-steering.spec.ts
          e2e/chat-done-preview-persistence.spec.ts
          e2e/chat-mermaid-rendering.spec.ts
          e2e/chat-model-switch-context.spec.ts
          e2e/chat-browser-workspace.spec.ts
          e2e/browser-agent-interaction-runtime.spec.ts
          e2e/chat-terminal-dock.spec.ts
          e2e/chat-turn-navigation.spec.ts
          e2e/chat-plan-progress-panel.spec.ts
          e2e/chat-recording-dock.spec.ts
          --grep "themed window frame|Agent browser interaction|Agent drag uses observation-scoped|Agent pointer preparation|conversation actions offer archive and delete|archived conversations can be restored|a direct archived conversation link|retries a persisted user message|edits a persisted user message through the durable retry boundary|restores the persisted reply suffix|reconciles the durable reply suffix|generates the initial empty chat title once|hydrates a paused run with its durable partial output|model selector|shared Browser Workspace|interactive terminal dock|floating plan capsule|only the Plan capsule drags|Mermaid|turn timeline|right-side timeline|file edit badges|recording dock exposes responsive"

      - name: Upload browser regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  linux_desktop:
    name: Linux Desktop Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        uses: ./.github/actions/install-ubuntu-packages
        timeout-minutes: 10
        with:
          packages: |
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf
            libssl-dev
            libgtk-3-dev
            libjavascriptcoregtk-4.1-dev
            libsoup-3.0-dev
            libdbus-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Cache ONNX Runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ort.pyke.io
          key: ${{ runner.os }}-ort-${{ hashFiles('crates/core/Cargo.toml') }}

      - name: Prepare Tauri frontend stub
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          printf '%s\n' '<!doctype html><html></html>' > apps/desktop/dist/index.html

      - name: Desktop Rust check
        run: cargo check -p nexa-desktop

  # Keep this name stable: callers and merge policy treat it as the public CI
  # interface while the implementation jobs above may evolve independently.
  check:
    name: Check & Lint
    if: ${{ always() }}
    needs:
      - repository_policy
      - rust_core
      - office_smoke
      - frontend
      - browser_regressions
      - linux_desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        env:
          REPOSITORY_POLICY_RESULT: ${{ needs.repository_policy.result }}
          RUST_CORE_RESULT: ${{ needs.rust_core.result }}
          OFFICE_SMOKE_RESULT: ${{ needs.office_smoke.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_REGRESSIONS_RESULT: ${{ needs.browser_regressions.result }}
          LINUX_DESKTOP_RESULT: ${{ needs.linux_desktop.result }}
        shell: bash
        run: |
          results=(
            "Repository Policy:$REPOSITORY_POLICY_RESULT"
            "Rust Core:$RUST_CORE_RESULT"
            "Office Artifact Smoke:$OFFICE_SMOKE_RESULT"
            "Frontend Contracts & Build:$FRONTEND_RESULT"
            "Browser Regressions:$BROWSER_REGRESSIONS_RESULT"
            "Linux Desktop Check:$LINUX_DESKTOP_RESULT"
          )

          failed=0
          for result in "${results[@]}"; do
            echo "$result"
            if [[ "$result" != *":success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

  windows-check:
    name: Windows Desktop Check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-nexa-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nexa-v1-

      - name: Prepare Tauri frontend stub
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/dist | Out-Null
          Set-Content -Path apps/desktop/dist/index.html -Value '<!doctype html><html></html>'

      - name: Desktop Rust check
        run: cargo check -p nexa-desktop
