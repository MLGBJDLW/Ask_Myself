name: Native Office Acceptance

on:
  workflow_call:
    inputs:
      target_ref:
        description: Release tag or ref whose source is under acceptance
        required: true
        type: string
      target_sha:
        description: Immutable commit expected for the accepted source
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_ref:
        description: Optional tag or ref; defaults to the selected workflow ref
        required: false
        type: string
      target_sha:
        description: Optional expected commit; defaults to the selected workflow SHA
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: office-native-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  office_native:
    name: Word Excel PowerPoint native acceptance
    environment: office-native-acceptance
    runs-on: [self-hosted, Windows, X64, office-native]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref || github.sha }}

      - name: Verify exact clean checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expectedSha = $env:EXPECTED_SHA.Trim().ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "Checked-out SHA $actualSha does not match $expectedSha"
          }
          if (git status --porcelain=v1 --untracked-files=all) {
            throw 'Native acceptance requires a clean checkout.'
          }

      - name: Prepare hash-locked Office Python runtime
        shell: pwsh
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/nexa-office-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "nexa-office-python-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $env:ACCEPTANCE_ROOT | Out-Null
          python -m venv $venv
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --require-hashes -r crates/core/assets/skills/doc-script-editor/scripts/requirements.lock
          & $python -c "import win32com.client, docx, openpyxl, pptx"
          Get-Command pdftoppm -ErrorAction Stop | Out-Null
          "OFFICE_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run SHA-bound native acceptance
        shell: pwsh
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/nexa-office-native-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
          NEXA_RUN_OFFICE_NATIVE_SMOKE: '1'
        run: |
          & $env:OFFICE_PYTHON crates/core/assets/skills/doc-script-editor/scripts/office_native_acceptance.py `
            --repo-root $env:GITHUB_WORKSPACE `
            --output-dir $env:ACCEPTANCE_ROOT `
            --expected-sha $env:EXPECTED_SHA

      - name: Hash acceptance certificate
        shell: pwsh
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/nexa-office-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $report = Join-Path $env:ACCEPTANCE_ROOT 'office-native-acceptance.json'
          $hash = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLowerInvariant()
          "OFFICE_ACCEPTANCE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Office native acceptance report SHA-256: $hash"

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-native-acceptance-${{ inputs.target_sha || github.sha }}
          path: ${{ runner.temp }}/nexa-office-native-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30

      - name: Attest SHA-bound acceptance certificate
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/nexa-office-native-${{ github.run_id }}-${{ github.run_attempt }}/office-native-acceptance.json
