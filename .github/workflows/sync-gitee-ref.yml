name: Sync ref to Gitee

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to push to Gitee (branch or tag)
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: sync-gitee-ref-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push ref to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'ButlerW' }}
          GITEE_REPOSITORY: ButlerW/Nexa
          INPUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::error::GITEE_TOKEN repository secret is required."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_REPOSITORY}.git"

          if [ -n "${INPUT_REF}" ]; then
            if git show-ref --verify --quiet "refs/heads/${INPUT_REF}" || git ls-remote --exit-code --heads origin "${INPUT_REF}" >/dev/null 2>&1; then
              git fetch origin "${INPUT_REF}:refs/remotes/origin/${INPUT_REF}"
              git push gitee "refs/remotes/origin/${INPUT_REF}:refs/heads/${INPUT_REF}"
            else
              TAG_NAME="${INPUT_REF#refs/tags/}"
              git fetch origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
              git push gitee "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            fi
          elif [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            git push gitee "HEAD:refs/heads/${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push gitee "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          else
            echo "::error::Unsupported ref type: ${GITHUB_REF_TYPE}"
            exit 1
          fi
