name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to resume; leave empty for release PR maintenance
        required: false
        type: string

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.resume.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.resume.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.resume.outputs.version || steps.release.outputs.version }}
      target_ref: ${{ steps.resume.outputs.tag_name || steps.release.outputs.tag_name }}
      target_sha: ${{ steps.resume.outputs.target_sha || github.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: master
          # Push runs create/update the release PR for new conventional commits,
          # then create the release/tag when that release PR is merged.
          # Manual runs without release_tag are PR maintenance only.
          skip-github-release: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Resolve existing draft release
        id: resume
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^nexa-monorepo-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Invalid Nexa release tag: $RELEASE_TAG"
            exit 1
          fi

          release_json=$(gh release view "$RELEASE_TAG" \
            --json isDraft,tagName \
            --repo "$GITHUB_REPOSITORY")
          actual_tag=$(jq -r '.tagName' <<<"$release_json")
          is_draft=$(jq -r '.isDraft' <<<"$release_json")
          if [ "$actual_tag" != "$RELEASE_TAG" ]; then
            echo "::error::Resolved release tag $actual_tag does not match requested tag $RELEASE_TAG"
            exit 1
          fi
          if [ "$is_draft" != "true" ]; then
            echo "::error::Release $RELEASE_TAG is not a draft release"
            exit 1
          fi

          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          version="${RELEASE_TAG#nexa-monorepo-v}"
          comparison_status=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$target_sha...master" \
            --jq .status)
          if [ "$comparison_status" != "ahead" ] && [ "$comparison_status" != "identical" ]; then
            echo "::error::Release target $target_sha is not an ancestor of master"
            exit 1
          fi

          manifest_version=$(gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$target_sha" \
            --jq .version)
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Release tag version $version does not match package.json version $manifest_version"
            exit 1
          fi

          {
            echo "release_created=true"
            echo "tag_name=$RELEASE_TAG"
            echo "version=$version"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Trigger checks for release PR updates made by GITHUB_TOKEN
        if: (github.event_name != 'workflow_dispatch' || inputs.release_tag == '') && steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
          RELEASE_PR_BRANCH: release-please--branches--master--components--nexa-monorepo
        run: |
          set -euo pipefail
          if [ "$HAS_RELEASE_PLEASE_TOKEN" = "true" ]; then
            exit 0
          fi

          OWNER="${GITHUB_REPOSITORY%%/*}"
          PR_COUNT=$(gh pr list --state open --head "$OWNER:$RELEASE_PR_BRANCH" --json number --jq 'length')
          if [ "$PR_COUNT" = "0" ]; then
            exit 0
          fi
          gh workflow run ci.yml --ref "$RELEASE_PR_BRANCH"

      - name: Ensure release stays draft until artifacts are verified
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ steps.release.outputs.tag_name }} --draft --repo ${{ github.repository }}

  native-office-acceptance:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/office-native-acceptance.yml
    with:
      target_ref: ${{ needs.release-please.outputs.target_ref }}
      target_sha: ${{ needs.release-please.outputs.target_sha }}

  preflight:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Validate release signing secrets
        env:
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_TAURI_SIGNING_PRIVATE_KEY" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to produce signed updater bundles. The draft release will not be published."
            exit 1
          fi

  build:
    needs: [release-please, preflight, native-office-acceptance]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.target_sha }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Select Xcode 16.4 (macOS)
        if: matrix.platform == 'macos-15'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-v2-${{ matrix.target }}
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Build reviewed PptxGenJS runtime bundle
        shell: bash
        run: |
          npm ci
          npm audit --audit-level=high
          npm run office:supply-chain:test
          npm run office:pptxgenjs:bundle
          test -f apps/desktop/src-tauri/resources/pptxgenjs-runtime/runtime-manifest.json

      - name: Setup .NET for Open XML schema validator
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424

      - name: Bundle self-contained Open XML schema validator
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) rid="win-x64" ;;
            Linux) rid="linux-x64" ;;
            macOS) rid="osx-arm64" ;;
            *) echo "Unsupported validator runner: ${{ runner.os }}"; exit 1 ;;
          esac
          output="apps/desktop/src-tauri/resources/openxml-validator"
          dotnet publish tools/openxml-validator/Nexa.OpenXml.Validator.csproj \
            -c Release -r "$rid" --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -o "$output"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f "$output/Nexa.OpenXml.Validator.exe"
          else
            test -x "$output/Nexa.OpenXml.Validator"
          fi

      - name: Bundle reviewed Office.js add-in
        shell: bash
        run: |
          destination="apps/desktop/src-tauri/resources/office-addin"
          mkdir -p "$destination"
          cp integrations/office-addin/manifest.xml "$destination/"
          cp integrations/office-addin/manifest.template.xml "$destination/"
          cp integrations/office-addin/taskpane.html "$destination/"
          cp integrations/office-addin/taskpane.js "$destination/"
          cp integrations/office-addin/support.html "$destination/"
          cp integrations/office-addin/icon.png "$destination/"
          cp integrations/office-addin/render_manifest.py "$destination/"
          cp integrations/office-addin/serve_https.py "$destination/"
          cp integrations/office-addin/README.md "$destination/"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Remove stale native build cache (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo clean --manifest-path apps/desktop/src-tauri/Cargo.toml 2>/dev/null \
            || cargo clean || true
          rm -rf "$HOME/Library/Caches/ort.pyke.io"

      - name: Fix clang_rt.osx search path (macOS / Xcode 16)
        if: runner.os == 'macOS'
        run: |
          # rustc for aarch64-apple-darwin emits -lclang_rt.osx and
          # -L .../clang/<MAJOR>/lib/darwin, but Xcode 16 stores the runtime
          # under the full version directory (e.g. "17.0.6"), not just "17".
          # Create a major-version symlink so the linker search path resolves.
          CLANG_BASE="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang"
          for dir in "$CLANG_BASE"/*/; do
            [ -d "$dir" ] || continue
            full=$(basename "$dir")
            major="${full%%.*}"
            if [ "$full" != "$major" ] && [ ! -e "$CLANG_BASE/$major" ]; then
              sudo ln -sf "$dir" "$CLANG_BASE/$major"
              echo "Created symlink: $CLANG_BASE/$major -> $dir"
            fi
          done

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}

      - name: Upload artifacts to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET_SHA: ${{ needs.release-please.outputs.target_sha }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error::Release tag $TAG moved from $TARGET_SHA to $actual_sha"
            exit 1
          fi

          ARTIFACTS='${{ steps.tauri.outputs.artifactPaths }}'
          echo "Uploading artifacts for $TAG"
          {
            printf '%s' "$ARTIFACTS" | jq -r '.[]?' 2>/dev/null || true
            find apps/desktop/src-tauri/target -type f \
              \( -name '*.sig' -o -name '*.zip' -o -name '*.msi' -o -name '*.exe' \
                 -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.tar.gz' -o -name '*.tar.xz' \) 2>/dev/null || true
          } | sed '/^[[:space:]]*$/d' | sort -u > /tmp/artifacts.txt

          ARTIFACT_COUNT=$(wc -l < /tmp/artifacts.txt | tr -d ' ')
          echo "Found $ARTIFACT_COUNT artifact(s)"
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No Tauri bundle artifacts were found for upload."
            exit 1
          fi

          while IFS= read -r artifact; do
            if [ -f "$artifact" ]; then
              echo "  -> $(basename "$artifact")"
              gh release upload "$TAG" "$artifact" --clobber --repo "${{ github.repository }}"
            fi
          done < /tmp/artifacts.txt

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify release artifacts and generate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          TARGET_SHA: ${{ needs.release-please.outputs.target_sha }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          REPO="${{ github.repository }}"
          actual_sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error::Release tag $TAG moved from $TARGET_SHA to $actual_sha"
            exit 1
          fi

          gh release view "$TAG" --json body -q .body --repo "$REPO" > /tmp/release-notes.md
          NOTES=$(head -c 5000 /tmp/release-notes.md)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::❌ release-please output version is not valid semver: $VERSION"
            exit 1
          fi

          gh release view "$TAG" --json assets -q '.assets[].name' --repo "$REPO" | sort > /tmp/assets.txt
          echo "Release assets:"
          sed 's/^/  - /' /tmp/assets.txt

          require_asset() {
            local asset_name="$1"
            if ! grep -Fxq "$asset_name" /tmp/assets.txt; then
              echo "::error::Missing release asset: $asset_name"
              exit 1
            fi
          }

          # Download .sig files after all matrix builds have uploaded artifacts.
          mkdir -p /tmp/sigs
          gh release download "$TAG" --pattern "*.sig" --dir /tmp/sigs --repo "$REPO" || true

          SIG_COUNT=$(find /tmp/sigs -name '*.sig' 2>/dev/null | wc -l)
          echo "Found $SIG_COUNT .sig file(s)"
          if [ "$SIG_COUNT" -eq 0 ]; then
            echo "::error::❌ No .sig files found in release $TAG. Auto-updater requires signed bundles."
            echo "::error::可能原因：TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets 未配置或无效；或 build-release job 未成功产出 .sig 资产。"
            exit 1
          fi

          # Build platform entries
          PLATFORMS="{}"

          release_asset_url() {
            local asset_name="$1"
            local encoded
            encoded=$(printf '%s' "$asset_name" | jq -sRr @uri)
            printf 'https://github.com/%s/releases/download/%s/%s' "$REPO" "$TAG" "$encoded"
          }

          add_platform() {
            local platform="$1"
            local sig_pattern="$2"
            local sig_file
            local sig
            local asset_name
            local url

            sig_file=$(find /tmp/sigs -maxdepth 1 -type f -name "$sig_pattern" | sort | head -n 1)
            if [ -z "$sig_file" ]; then
              return 0
            fi

            sig=$(cat "$sig_file")
            asset_name=$(basename "$sig_file" .sig)
            require_asset "$asset_name"
            url=$(release_asset_url "$asset_name")
            echo "Adding updater platform $platform -> $asset_name"
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg platform "$platform" --arg sig "$sig" --arg url "$url" '. + {($platform): {"signature": $sig, "url": $url}}')
          }

          add_platform "windows-x86_64" "*x64-setup.nsis.zip.sig"
          add_platform "linux-x86_64" "*amd64.AppImage.tar.gz.sig"
          # macOS currently publishes DMG only. Tauri updater entries require
          # signed .app.tar.gz bundles, so include darwin only if CI produces one.
          add_platform "darwin-aarch64" "*.app.tar.gz.sig"

          REQUIRED_UPDATER_PLATFORMS=(windows-x86_64 linux-x86_64)
          for platform in "${REQUIRED_UPDATER_PLATFORMS[@]}"; do
            if ! echo "$PLATFORMS" | jq -e --arg platform "$platform" 'has($platform)' >/dev/null; then
              echo "::error::Missing signed updater bundle for $platform. Release remains draft."
              exit 1
            fi
          done

          # Generate latest.json only after all required platform artifacts are present.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json

          MIRROR_BASE="${UPDATE_MIRROR_BASE:-https://mirror.ghproxy.com}"
          MIRROR_BASE="${MIRROR_BASE%/}"
          jq --arg base "$MIRROR_BASE" \
            '.platforms |= with_entries(.value.url = ($base + "/" + .value.url))' \
            latest.json > latest-ghproxy.json

          PLATFORM_COUNT=$(echo "$PLATFORMS" | jq 'keys | length')
          REQUIRED_PLATFORM_COUNT="${#REQUIRED_UPDATER_PLATFORMS[@]}"
          if [ "$PLATFORM_COUNT" -lt "$REQUIRED_PLATFORM_COUNT" ]; then
            echo "::error::latest.json must contain at least $REQUIRED_PLATFORM_COUNT updater platforms; found $PLATFORM_COUNT."
            exit 1
          fi
          echo "latest.json contains $PLATFORM_COUNT platform(s)"

          gh release upload "$TAG" latest.json latest-ghproxy.json --clobber --repo "$REPO"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET_SHA: ${{ needs.release-please.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error::Release tag $RELEASE_TAG moved from $TARGET_SHA to $actual_sha"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
